name: Fundoo Microservices CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore Dependencies
      run: dotnet restore FundooMicroservice.slnx

    - name: Build Solution
      run: dotnet build FundooMicroservice.slnx --no-restore --configuration Release

    - name: Execute Automated Tests
      run: dotnet test FundooMicroservice.slnx --no-build --configuration Release --verbosity normal

  docker-build:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build User API Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/Services/User/Fundoo.User.Api/Dockerfile
        push: false
        tags: fundoo-user-api:latest

    - name: Build Notes API Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/Services/Notes/Fundoo.Notes.Api/Dockerfile
        push: false
        tags: fundoo-notes-api:latest

    - name: Build Notification API Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/Services/Notification/Fundoo.Notification.Api/Dockerfile
        push: false
        tags: fundoo-notification-api:latest

    - name: Build API Gateway Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/ApiGateway/Fundoo.ApiGateway/Dockerfile
        push: false
        tags: fundoo-gateway:latest
