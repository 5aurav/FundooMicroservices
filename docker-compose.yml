services:
  # -------------------------------------------------------------
  # Infrastructure: Databases
  # -------------------------------------------------------------
  keycloak-db:
    image: postgres:16-alpine
    container_name: fundoo-keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-fundoo_keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me-locally}
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  user-db:
    image: postgres:16-alpine
    container_name: fundoo-user-db
    environment:
      POSTGRES_DB: fundoo_user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fundoo_user"]
      interval: 5s
      timeout: 3s
      retries: 20

  notes-db:
    image: postgres:16-alpine
    container_name: fundoo-notes-db
    environment:
      POSTGRES_DB: fundoo_notes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fundoo_notes"]
      interval: 5s
      timeout: 3s
      retries: 20

  notification-db:
    image: postgres:16-alpine
    container_name: fundoo-notification-db
    environment:
      POSTGRES_DB: fundoo_notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fundoo_notification"]
      interval: 5s
      timeout: 3s
      retries: 20

  # -------------------------------------------------------------
  # Infrastructure: Identity & Cache & Messaging & Mail
  # -------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fundoo-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-fundoo_keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me-locally}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-locally}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-fundoo.json:/opt/keycloak/data/import/realm-fundoo.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: fundoo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: fundoo-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fundoo-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: fundoo-mailhog
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    restart: unless-stopped

  # -------------------------------------------------------------
  # Operations: Database Migration Runner
  # -------------------------------------------------------------
  migration-runner:
    build:
      context: .
      dockerfile: src/Tools/Fundoo.MigrationRunner/Dockerfile
    container_name: fundoo-migration-runner
    environment:
      ConnectionStrings__UserDb: Host=user-db;Port=5432;Database=fundoo_user;Username=postgres;Password=postgrespassword
      ConnectionStrings__NotificationDb: Host=notification-db;Port=5432;Database=fundoo_notification;Username=postgres;Password=postgrespassword
      ConnectionStrings__NotesDb: Host=notes-db;Port=5432;Database=fundoo_notes;Username=postgres;Password=postgrespassword
    depends_on:
      user-db:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      notes-db:
        condition: service_healthy
    restart: "no"

  # -------------------------------------------------------------
  # Microservices
  # -------------------------------------------------------------
  user-api-1:
    build:
      context: .
      dockerfile: src/Services/User/Fundoo.User.Api/Dockerfile
    container_name: fundoo-user-api-1
    environment:
      ConnectionStrings__UserDb: Host=user-db;Port=5432;Database=fundoo_user;Username=postgres;Password=postgrespassword
      Kafka__BootstrapServers: kafka:29092
      Redis__Configuration: redis:6379
      Keycloak__Authority: http://keycloak:8080/realms/fundoo
      Jwt__SigningKey: FundooSuperSecretKeyForJwtAuthenticationAndOcelotValidation2026!
      Jwt__Issuer: fundoo-user-api
      Jwt__Audience: fundoo-clients
    ports:
      - "7001:8080"
    depends_on:
      migration-runner:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

  user-api-2:
    build:
      context: .
      dockerfile: src/Services/User/Fundoo.User.Api/Dockerfile
    container_name: fundoo-user-api-2
    environment:
      ConnectionStrings__UserDb: Host=user-db;Port=5432;Database=fundoo_user;Username=postgres;Password=postgrespassword
      Kafka__BootstrapServers: kafka:29092
      Redis__Configuration: redis:6379
      Keycloak__Authority: http://keycloak:8080/realms/fundoo
      Jwt__SigningKey: FundooSuperSecretKeyForJwtAuthenticationAndOcelotValidation2026!
      Jwt__Issuer: fundoo-user-api
      Jwt__Audience: fundoo-clients
    ports:
      - "7011:8080"
    depends_on:
      migration-runner:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

  notes-api-1:
    build:
      context: .
      dockerfile: src/Services/Notes/Fundoo.Notes.Api/Dockerfile
    container_name: fundoo-notes-api-1
    environment:
      ConnectionStrings__NotesDb: Host=notes-db;Port=5432;Database=fundoo_notes;Username=postgres;Password=postgrespassword
      Redis__Configuration: redis:6379
      Jwt__SigningKey: FundooSuperSecretKeyForJwtAuthenticationAndOcelotValidation2026!
      Jwt__Issuer: fundoo-user-api
      Jwt__Audience: fundoo-clients
      InternalSecurity__SharedSecret: FundooInternalMicroservicesSecretToken_2026_Secure!
    ports:
      - "7002:8080"
    depends_on:
      migration-runner:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  notes-api-2:
    build:
      context: .
      dockerfile: src/Services/Notes/Fundoo.Notes.Api/Dockerfile
    container_name: fundoo-notes-api-2
    environment:
      ConnectionStrings__NotesDb: Host=notes-db;Port=5432;Database=fundoo_notes;Username=postgres;Password=postgrespassword
      Redis__Configuration: redis:6379
      Jwt__SigningKey: FundooSuperSecretKeyForJwtAuthenticationAndOcelotValidation2026!
      Jwt__Issuer: fundoo-user-api
      Jwt__Audience: fundoo-clients
      InternalSecurity__SharedSecret: FundooInternalMicroservicesSecretToken_2026_Secure!
    ports:
      - "7012:8080"
    depends_on:
      migration-runner:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  notification-api:
    build:
      context: .
      dockerfile: src/Services/Notification/Fundoo.Notification.Api/Dockerfile
    container_name: fundoo-notification-api
    environment:
      ConnectionStrings__NotificationDb: Host=notification-db;Port=5432;Database=fundoo_notification;Username=postgres;Password=postgrespassword
      Kafka__BootstrapServers: kafka:29092
      Smtp__Host: mailhog
      Smtp__Port: 1025
      InternalSecurity__SharedSecret: FundooInternalMicroservicesSecretToken_2026_Secure!
    ports:
      - "7003:8080"
    depends_on:
      migration-runner:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      mailhog:
        condition: service_started

  # -------------------------------------------------------------
  # API Gateway
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Fundoo.ApiGateway/Dockerfile
    container_name: fundoo-gateway
    environment:
      Jwt__SigningKey: FundooSuperSecretKeyForJwtAuthenticationAndOcelotValidation2026!
      Jwt__Issuer: fundoo-user-api
      Jwt__Audience: fundoo-clients
      InternalSecurity__SharedSecret: FundooInternalMicroservicesSecretToken_2026_Secure!
    ports:
      - "7000:8080"
    depends_on:
      - user-api-1
      - user-api-2
      - notes-api-1
      - notes-api-2
      - notification-api
